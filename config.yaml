server:
  host: 0.0.0.0
  port: 8000
  storage_dir: data/captures
  db_path: data/autoinsta.db
  client_api_key: autoinsta_device_secret_token_123
sensors:
  enable_camera: true
  enable_gps: true
  enable_accelerometer: false
  enable_light_sensor: false
  enable_microphone: true
  enable_barometer: false
  enable_battery: true
  enable_pedometer: false
  enable_heart_rate: false
  heart_rate_alert:
    enabled: false
    min_bpm: 45
    max_bpm: 145
    countdown_seconds: 10
    sound_alarm: true
    vibration_alarm: true
    allow_sms_dispatch: false
    allow_gps_emergency_override: true
    local_alarm_only: false
    webhook_url: ''
    channels:
    - sms
    - telegram
    - webhook
vlm:
  model: gemini-1.5-flash
  temperature: 0.7
  min_social_score: 7.5
  strict_privacy: true
  require_quality_pass: true
  persona: witty_minimalist
  language: fr
  persona_instructions: 'Tu rédiges des légendes Instagram naturelles, spontanées
    et élégantes à la première personne.

    Ne sonne jamais comme un robot ou une marque.

    Intègre subtilement le lieu et l''ambiance si des données GPS ou d''activité sont
    fournies.

    Ajoute 2 à 4 hashtags discrets à la fin.

    '
publisher:
  mode: local_only
  export_directory: data/my_private_photos
  require_manual_confirmation: false
  target_type: feed
  min_interval_minutes: 60
  max_daily_posts: 4
client:
  capture_interval_seconds: 30
  motion_threshold: 0.25
  darkness_threshold: 15
