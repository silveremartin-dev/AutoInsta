# AutoInsta Configuration File

server:
  host: "0.0.0.0"
  port: 8000
  storage_dir: "data/captures"
  db_path: "data/autoinsta.db"
  client_api_key: "autoinsta_device_secret_token_123"

# Granular Sensor Settings
sensors:
  enable_camera: true
  enable_gps: true                  # GPS coordinates, reverse-geocoding city/neighborhood
  enable_accelerometer: true        # Motion detection (pauses capture when completely still)
  enable_light_sensor: true         # Avoids taking pictures inside dark pockets or bags
  enable_heart_rate: false          # Physiological wearable / BLE heart rate monitoring
  
  # Heart Rate Emergency Alert (Experimental / Non-medical)
  heart_rate_alert:
    enabled: false
    min_bpm: 45                     # Low heart rate threshold (Bradycardia alert)
    max_bpm: 145                    # High heart rate threshold (Tachycardia alert)
    alert_channel: "webhook"        # "sms" (via Termux), "telegram", or "webhook"
    emergency_contact: ""           # Phone number for SMS or recipient ID
    webhook_url: ""                 # Emergency webhook URL (e.g. Home Assistant, Discord, IFTTT)

vlm:
  model: "gemini-1.5-flash"
  temperature: 0.7
  min_social_score: 7.0             # Score between 0.0 and 10.0 required to propose posting
  
  # Strict Privacy & Safety Filters
  strict_privacy: true              # Zero-tolerance for screens, banking, intimate spaces, nudity
  require_quality_pass: true        # Avoid pure black, occluded, or severely motion-blurred shots

  # Persona style for generated captions
  # Options: spontaneous_chic, witty_minimalist, candid_existential, poetic_flaneur, tech_nomad
  persona: "spontaneous_chic"
  language: "fr"                     # Default caption language

  # Custom prompt guidance
  persona_instructions: |
    Tu rédiges des légendes Instagram naturelles, spontanées et élégantes à la première personne.
    Ne sonne jamais comme un robot ou une marque.
    Intègre subtilement le lieu et l'ambiance si des données GPS ou d'activité sont fournies.
    Ajoute 2 à 4 hashtags discrets à la fin.

publisher:
  # Mode: "dry_run" (simulation & preview), "instagrapi", or "meta_graph"
  mode: "dry_run"
  
  # Approval Workflow
  require_manual_confirmation: true # If true, never auto-posts without user clicking Accept/Approve
  
  target_type: "feed"               # "feed" or "story"
  min_interval_minutes: 60          # Minimum time between posts
  max_daily_posts: 4                # Maximum posts per 24 hours

client:
  capture_interval_seconds: 30
  motion_threshold: 0.25
  darkness_threshold: 15

